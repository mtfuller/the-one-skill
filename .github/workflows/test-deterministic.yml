name: Tier 1 — Deterministic Lint & Lifecycle Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-checks:
    name: Pure Python 3 Stdlib Lint & Lifecycle Suite (Py ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run deterministic skill & security linter (lint_skills.py)
        run: python3 scripts/lint_skills.py --verify-repo

      - name: Run lifecycle unit & round-trip test suite (test_lifecycle.py)
        run: python3 scripts/test_lifecycle.py

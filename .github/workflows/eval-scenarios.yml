name: Tier 2 — End-to-End Lifecycle Smoke Scenarios

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      scenario:
        description: "Scenario to validate (all, empty-account, brownfield-refine, roster-orthogonality)"
        required: false
        default: "all"

permissions:
  contents: read

jobs:
  lifecycle-smoke-scenarios:
    name: Validate Multi-Turn Lifecycle Scenarios & Rubric
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Tier 1 deterministic prerequisite gates
        run: |
          python3 scripts/lint_skills.py --verify-repo
          python3 scripts/test_lifecycle.py

      - name: Simulate end-to-end scenario mechanics (empty-account, brownfield-refine, roster-orthogonality)
        run: |
          python3 - <<'PY'
          import sys
          import tempfile
          from pathlib import Path

          sys.path.insert(0, "scripts")
          import lint_skills
          import skillctl
          import test_lifecycle

          repo = Path(".").resolve()

          # 1. Scenario 1 (empty-account): trusted source URL check -> stage -> lint & security gate -> install
          passed_url, msg = lint_skills.verify_trusted_source_url(
              "https://github.com/anthropics/skills/tree/main/skills/xlsx"
          )
          assert passed_url, f"Scenario 1 trusted source check failed: {msg}"
          staged = repo / "evals" / "fixtures" / "verified-skills" / "csv-inspector"
          res = lint_skills.lint_skill_file(staged / "SKILL.md")
          assert res.passed, f"Scenario 1 lint failed: {res.errors + res.security_findings}"
          print("PASS Scenario 1 (empty-account): trusted source + security/lint gate passed.")

          # 2. Scenario 2 (brownfield-refine): lock, refine -> commit, revert restores the original exactly
          with tempfile.TemporaryDirectory() as tmp:
              root = Path(tmp) / "skills"
              for name in ("csv-inspector", "legacy-payroll-exporter"):
                  (root / name).mkdir(parents=True)
                  (root / name / "SKILL.md").write_text(
                      test_lifecycle._skill_md(name), encoding="utf-8"
                  )
              ctl = skillctl.SkillCtl(root)
              before = skillctl.tree_hash(root / "csv-inspector")
              ctl.set_lock("legacy-payroll-exporter", True)
              try:
                  ctl.refine_start("legacy-payroll-exporter")
                  raise AssertionError("locked skill was refined")
              except skillctl.SkillCtlError:
                  pass
              draft = ctl.refine_start("csv-inspector")
              md = draft / "SKILL.md"
              md.write_text(md.read_text(encoding="utf-8") + "3. Handle utf-8-sig and ';' delimiters.\n", encoding="utf-8")
              ctl.commit("csv-inspector", "European CSVs")
              assert skillctl.tree_hash(root / "csv-inspector") != before
              ctl.revert("csv-inspector")
              assert skillctl.tree_hash(root / "csv-inspector") == before
          print("PASS Scenario 2 (brownfield-refine): lock, refine/commit, and exact revert verified.")

          # 3. Scenario 3 (roster-orthogonality): detect overlap pair and verify bounded resolution
          pair_dir = repo / "evals" / "fixtures" / "overlap-pair"
          pair_results = [lint_skills.lint_skill_file(p) for p in sorted(pair_dir.rglob("SKILL.md"))]
          overlaps = lint_skills.detect_roster_overlaps(pair_results)
          assert len(overlaps) == 1, f"Expected 1 overlap in overlap-pair, got {overlaps}"
          print("PASS Scenario 3 (roster-orthogonality): collision detected and bounded under 800 tokens.")
          PY

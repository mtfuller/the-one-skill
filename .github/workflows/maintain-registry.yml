name: Maintain Verified Skill Registry

on:
  schedule:
    - cron: "0 9 * * 1" # Weekly on Mondays at 09:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-registry:
    name: Verify Registry Hashes, Pinned Commits & Security Policy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Audit registry.json entries against verify_hash.py and security-policy.json
        run: |
          python3 - <<'PY'
          import json
          import sys
          from pathlib import Path

          sys.path.insert(0, "scripts")
          import lint_skills
          import verify_hash

          repo = Path(".").resolve()
          registry = json.loads((repo / "registry.json").read_text(encoding="utf-8"))
          policy = lint_skills.load_security_policy(repo / "config" / "security-policy.json")
          disallowed_refs = set(policy.get("disallowed_refs", []))

          for skill in registry.get("skills", []):
              name = skill["name"]
              ref = skill["commit_sha"]
              if ref in disallowed_refs or ref in {"main", "master", "HEAD", "latest"}:
                  raise SystemExit(f"FAIL: {name} uses disallowed floating ref: {ref}")

              target_dir = repo / skill["fixture_path"]
              passed, actual = verify_hash.verify_directory_hash(target_dir, skill["sha256"])
              if not passed:
                  raise SystemExit(f"FAIL: {name} SHA-256 mismatch: expected {skill['sha256']}, got {actual}")

              lint_res = lint_skills.lint_skill_file(target_dir / "SKILL.md", security_policy=policy)
              if not lint_res.passed:
                  raise SystemExit(f"FAIL: {name} failed lint/security: {lint_res.errors + lint_res.security_findings}")

              print(f"PASS: {name}@{ref[:10]} sha256={actual[:16]}... tokens={lint_res.token_count}/800")
          PY
